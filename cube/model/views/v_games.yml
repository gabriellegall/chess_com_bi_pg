views:
  - name: v_games
    description: "Row-level game view (one row per game and player), without measures. Used by Streamlit, which computes its own distributions (medians, percentiles)."

    cubes:
      - join_path: cube_games
        includes:
          - uuid
          - url
          - eco
          - end_time
          - time_class
          - time_control
          - playing_as
          - playing_rating
          - playing_rating_range
          - opponent_rating
          - opponent_rating_range
          - playing_result
          - rated
          - nb_games
          - nb_wins
          - nb_losses
          - nb_draws
          - win_rate
          - avg_playing_rating
          - avg_opponent_rating
          - avg_rating_gap

      - join_path: cube_games.cube_players
        includes:
          - username_global

      # games_sk comes from games_stats: it is NULL for games not evaluated by Stockfish.
      - join_path: cube_games.cube_games_stats
        includes:
          - games_sk
          - nb_moves
          - prct_time_remaining_playing_early
          - prct_time_remaining_playing_mid
          - prct_time_remaining_playing_late
          - has_throw_blunder_playing
          - has_throw_blunder_playing_early
          - has_throw_blunder_playing_mid
          - has_throw_blunder_playing_late
          - has_throw_big_blunder_playing
          - has_throw_big_blunder_playing_early
          - has_throw_big_blunder_playing_mid
          - has_throw_big_blunder_playing_late
          - has_miss_opp_blunder_playing
          - has_miss_opp_blunder_playing_early
          - has_miss_opp_blunder_playing_mid
          - has_miss_opp_blunder_playing_late
          - has_miss_opp_big_blunder_playing
          - has_miss_opp_big_blunder_playing_early
          - has_miss_opp_big_blunder_playing_mid
          - has_miss_opp_big_blunder_playing_late
          - first_blunder_big_blunder_playing_prct_time_remaining
          - first_big_blunder_playing_prct_time_remaining
          - first_miss_opp_big_blunder_playing_prct_time_remaining
          - first_throw_big_blunder_playing_prct_time_remaining
          - score_playing_turn_5
          - score_playing_turn_10
          - score_playing_turn_15
          - score_playing_turn_20
          - score_playing_turn_25
          - score_playing_turn_30
          - score_playing_turn_35
          - score_playing_turn_40
          - score_playing_turn_45
          - score_playing_turn_50
          - max_score_playing_type
          - nb_games_analyzed
          - avg_nb_moves
          - big_blunders_per_game
          - blunders_per_game
          - blunders_per_game_early
          - blunders_per_game_mid
          - blunders_per_game_late
          - blunders_per_game_very_late
          - throw_blunder_rate
          - throw_big_blunder_rate
          - miss_opp_blunder_rate
          - miss_opp_big_blunder_rate
          - avg_prct_time_remaining_early
          - avg_prct_time_remaining_mid
          - avg_prct_time_remaining_late
          - avg_max_score

      - join_path: cube_games.cube_games_openings
        includes:
          - opening_level_1_name
          - opening_level_2_name
          - opening_level_7_name
          - opener_7_moves
          - nb_distinct_openings
