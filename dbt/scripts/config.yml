postgres:
  schemas:
    chess_com_api:  "raw_chess_com"
    stockfish:      "raw_stockfish"
    games_times:    "raw_times"
    openings:       "raw_openings"
  tables:
    chess_com_api:
      name: # managed by dlt
      index_field:  "end_time"
    stockfish:
      name:         "players_games_moves"
      index_field:  "log_timestamp"
      games_limit:  500 # max games analysed by stockfish per run
      depth:        12  # stockfish search depth per position (higher = more accurate, slower)
      workers:      6   # parallel stockfish processes (1 = sequential); ~physical CPU cores
    games_times:
      name:         "players_games_times"
      index_field:  "log_timestamp"
      games_limit:  10000 # max games processed per run
    openings:
      name:         "chess_openings"
      index_field: # no index needed
