cubes:
  - name: cube_games
    sql_table: marts.dim_games

    joins:
      - name: cube_players
        sql: "{CUBE}.players_sk = {cube_players}.players_sk"
        relationship: many_to_one

      - name: cube_games_stats
        sql: "{CUBE}.games_sk = {cube_games_stats}.games_sk"
        relationship: one_to_one

      - name: cube_games_openings
        sql: "{CUBE}.games_sk = {cube_games_openings}.games_sk"
        relationship: one_to_one

      - name: cube_game_moves
        sql: "{CUBE}.games_sk = {cube_game_moves}.games_sk"
        relationship: one_to_many

    dimensions:
      - name: games_sk
        sql: games_sk
        type: string
        primary_key: true

      - name: uuid
        sql: uuid
        type: string

      - name: url
        sql: url
        type: string

      - name: end_time
        sql: end_time
        type: time

      - name: time_class
        sql: time_class
        type: string

      - name: time_control
        sql: time_control
        type: string

      - name: rated
        sql: rated
        type: boolean

      - name: eco
        sql: eco
        type: string

      - name: playing_as
        sql: playing_as
        type: string

      - name: playing_result
        sql: playing_result
        type: string

      - name: playing_result_detailed
        sql: playing_result_detailed
        type: string

      - name: playing_rating
        sql: playing_rating
        type: number

      - name: opponent_rating
        sql: opponent_rating
        type: number

      - name: playing_rating_range
        sql: playing_rating_range
        type: string

      - name: opponent_rating_range
        sql: opponent_rating_range
        type: string

    measures:
      - name: nb_wins
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Win'"

      - name: nb_wins_last_30_days
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Win'"
          - sql: "{CUBE}.end_time >= CURRENT_DATE - INTERVAL '30 days'"

      - name: nb_losses
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Lose'"

      - name: nb_losses_last_30_days
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Lose'"
          - sql: "{CUBE}.end_time >= CURRENT_DATE - INTERVAL '30 days'"

      - name: win_rate
        type: number
        sql: "1.0 * {nb_wins} / NULLIF({nb_wins} + {nb_losses}, 0)"
        format: percent

      - name: win_rate_last_30_days
        type: number
        sql: "1.0 * {nb_wins_last_30_days} / NULLIF({nb_wins_last_30_days} + {nb_losses_last_30_days}, 0)"
        format: percent
