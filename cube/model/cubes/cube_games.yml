cubes:
  - name: cube_games
    sql_table: marts.fct_games

    joins:
      - name: cube_players
        sql: "{CUBE}.players_sk = {cube_players}.players_sk"
        relationship: many_to_one

      - name: cube_games_stats
        sql: "{CUBE}.games_sk = {cube_games_stats}.games_sk"
        relationship: one_to_one

      - name: cube_games_openings
        sql: "{CUBE}.games_sk = {cube_games_openings}.games_sk"
        relationship: one_to_one

      - name: cube_games_sessions
        sql: "{CUBE}.games_sk = {cube_games_sessions}.games_sk"
        relationship: one_to_one

      - name: cube_game_moves
        sql: "{CUBE}.games_sk = {cube_game_moves}.games_sk"
        relationship: one_to_many

    dimensions:
      - name: games_sk
        sql: games_sk
        type: string
        primary_key: true

      - name: uuid
        sql: uuid
        type: string

      - name: url
        sql: url
        type: string

      - name: end_time
        sql: end_time
        type: time

      - name: time_class
        sql: time_class
        type: string

      - name: time_control
        sql: time_control
        type: string

      - name: rated
        sql: rated
        type: boolean

      - name: eco
        sql: eco
        type: string

      - name: playing_as
        sql: playing_as
        type: string

      - name: playing_result
        sql: playing_result
        type: string

      - name: playing_result_detailed
        sql: playing_result_detailed
        type: string

      - name: playing_rating
        sql: playing_rating
        type: number

      - name: opponent_rating
        sql: opponent_rating
        type: number

      - name: playing_rating_range
        sql: playing_rating_range
        type: string

      - name: opponent_rating_range
        sql: opponent_rating_range
        type: string

      # 50-point rating bands (lower bound), finer than the *_rating_range dims for the ELO matrix
      - name: playing_rating_band
        sql: "FLOOR({CUBE}.playing_rating / 50.0) * 50"
        type: number

      - name: opponent_rating_band
        sql: "FLOOR({CUBE}.opponent_rating / 50.0) * 50"
        type: number

      # Opponent strength relative to the player (gap = opponent - player rating)
      - name: rating_gap_category
        type: string
        case:
          when:
            - sql: "{CUBE}.opponent_rating - {CUBE}.playing_rating < -50"
              label: Much weaker
            - sql: "{CUBE}.opponent_rating - {CUBE}.playing_rating < -15"
              label: Weaker
            - sql: "{CUBE}.opponent_rating - {CUBE}.playing_rating <= 15"
              label: Similar
            - sql: "{CUBE}.opponent_rating - {CUBE}.playing_rating <= 50"
              label: Stronger
          else:
            label: Much stronger

    measures:
      - name: nb_players
        sql: "{cube_players.players_sk}"
        type: count_distinct

      - name: nb_players_above_1000
        multi_stage: true
        sql: "{nb_players}"
        type: number
        filter:
          include:
            - member: cube_games.playing_rating
              operator: gt
              values:
                - "1000"

      - name: nb_wins
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Win'"

      - name: nb_wins_last_30_days
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Win'"
          - sql: "{CUBE}.end_time >= CURRENT_DATE - INTERVAL '30 days'"

      - name: nb_losses
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Lose'"

      - name: nb_losses_last_30_days
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Lose'"
          - sql: "{CUBE}.end_time >= CURRENT_DATE - INTERVAL '30 days'"

      - name: nb_games_played
        sql: games_sk
        type: count

      - name: nb_draws
        type: count
        filters:
          - sql: "{CUBE}.playing_result = 'Draw'"

      - name: avg_playing_rating
        sql: playing_rating
        type: avg

      - name: avg_opponent_rating
        sql: opponent_rating
        type: avg

      - name: win_rate
        type: number
        sql: "1.0 * {nb_wins} / NULLIF({nb_wins} + {nb_losses}, 0)"
        format: percent

      - name: win_rate_last_30_days
        type: number
        sql: "1.0 * {nb_wins_last_30_days} / NULLIF({nb_wins_last_30_days} + {nb_losses_last_30_days}, 0)"
        format: percent

      {%- for agg in ["min", "max", "avg"] %}
      - name: win_rate_per_player_{{ agg | safe }}
        multi_stage: true
        sql: "{win_rate}"
        type: {{ agg | safe }}
        format: percent
        filter:
          include:
            - member: cube_games.nb_games_played
              operator: gte
              values:
                - "30"
        grain:
          include:
            - cube_players.username_global
      {%- endfor %}

      # Variants of win_rate_per_player_max: grain (query grain + player vs. player only) x filter (WHERE applied vs. ignored)
      - name: win_rate_per_player_max_unfiltered
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        filter:
          keep_only: []
          include:
            - member: cube_games.nb_games_played
              operator: gte
              values:
                - "30"
        grain:
          include:
            - cube_players.username_global

      - name: win_rate_per_player_max_fixed_grain
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        filter:
          include:
            - member: cube_games.nb_games_played
              operator: gte
              values:
                - "30"
        grain:
          keep_only: []
          include:
            - cube_players.username_global

      - name: win_rate_per_player_max_fixed_grain_unfiltered
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        filter:
          keep_only: []
          include:
            - member: cube_games.nb_games_played
              operator: gte
              values:
                - "30"
        grain:
          keep_only: []
          include:
            - cube_players.username_global

      # keep_only alone only narrows the query's dims: if username_global is not in the query, the grain is empty
      - name: win_rate_per_player_max_keep_only
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        filter:
          include:
            - member: cube_games.nb_games_played
              operator: gte
              values:
                - "30"
        grain:
          keep_only:
            - cube_players.username_global

      # Tableau MAX({ FIXED username_global : win_rate }): the grain (query grain + player) only contains the
      # players present in each row, and each of them carries their overall (fixed, unfiltered) win rate
      - name: win_rate_per_player_max_tableau_fixed
        multi_stage: true
        sql: "{win_rate_per_player_max_fixed_grain_unfiltered}"
        type: max
        format: percent
        grain:
          include:
            - cube_players.username_global

      - name: avg_blunder_big_blunder_playing
        sql: "{cube_games_stats.nb_blunder_big_blunder_playing}"
        type: avg

      # Technique. Thresholds in centipawns: decisive advantage > +500 (should_win_range.mid in dbt),
      # lost position < -500, early resignation = resigned while the last evaluation was above -200.
      - name: nb_games_decisive_advantage
        sql: "CASE WHEN {cube_games_stats.max_score_playing} > 500 THEN 1 ELSE 0 END"
        type: sum

      - name: nb_wins_decisive_advantage
        sql: "CASE WHEN {cube_games_stats.max_score_playing} > 500 AND {CUBE}.playing_result = 'Win' THEN 1 ELSE 0 END"
        type: sum

      - name: conversion_rate
        type: number
        sql: "1.0 * {nb_wins_decisive_advantage} / NULLIF({nb_games_decisive_advantage}, 0)"
        format: percent

      - name: nb_games_lost_position
        sql: "CASE WHEN {cube_games_stats.min_score_playing} < -500 THEN 1 ELSE 0 END"
        type: sum

      - name: nb_saves_lost_position
        sql: "CASE WHEN {cube_games_stats.min_score_playing} < -500 AND {CUBE}.playing_result IN ('Win', 'Draw') THEN 1 ELSE 0 END"
        type: sum

      - name: save_rate
        type: number
        sql: "1.0 * {nb_saves_lost_position} / NULLIF({nb_games_lost_position}, 0)"
        format: percent

      - name: nb_resignations
        sql: "CASE WHEN {CUBE}.playing_result_detailed = 'resigned' THEN 1 ELSE 0 END"
        type: sum

      - name: nb_early_resignations
        sql: "CASE WHEN {CUBE}.playing_result_detailed = 'resigned' AND {cube_games_stats.final_score_playing} > -200 THEN 1 ELSE 0 END"
        type: sum

      - name: early_resignation_rate
        type: number
        sql: "1.0 * {nb_early_resignations} / NULLIF({nb_resignations}, 0)"
        format: percent

      - name: avg_blunder_big_blunder_playing_time_class_rating
        multi_stage: true
        sql: "{avg_blunder_big_blunder_playing}"
        type: max
        grain:
          keep_only:
            - cube_games.time_class
            - cube_games.playing_rating_range
        filter:
          keep_only: []

      # Return NULL instead of MAX when either of ["time_class", "playing_rating_range"] are aggregated: 
      {%- for dim in ["time_class", "playing_rating_range"] %}
      - name: nb_distinct_{{ dim | safe }}
        sql: "{{ dim | safe }}"
        type: count_distinct
        public: false

      - name: is_grouped_by_{{ dim | safe }}
        multi_stage: true
        sql: "{nb_distinct_{{- dim | safe -}} }"
        type: max
        public: false
        grain:
          keep_only:
            - cube_games.{{ dim | safe }}
        filter:
          keep_only: []
      {%- endfor %}

      - name: avg_blunder_big_blunder_playing_time_class_rating_2 
        multi_stage: true
        type: number
        sql: >
          CASE WHEN {is_grouped_by_time_class} = 1 AND {is_grouped_by_playing_rating_range} = 1
          THEN {avg_blunder_big_blunder_playing_time_class_rating} END

      - name: avg_blunder_big_blunder_playing_peers
        multi_stage: true
        sql: "{avg_blunder_big_blunder_playing}"
        type: max
        grain:
          exclude:
            - cube_players.username_global
        filter:
          exclude:
            - cube_players.username_global

      - name: avg_blunder_big_blunder_playing_vs_peers
        multi_stage: true
        sql: "{avg_blunder_big_blunder_playing} - {avg_blunder_big_blunder_playing_peers}"
        type: number