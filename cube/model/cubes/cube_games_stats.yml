cubes:
  - name: cube_games_stats
    sql_table: marts.fct_games_stats

    dimensions:
      - name: games_sk
        sql: games_sk
        type: string
        primary_key: true

      - name: max_score_playing_type
        sql: max_score_playing_type
        type: string

      - name: nb_moves
        sql: nb_moves
        type: number

      # Evaluation (centipawns, from the player's side): best and worst of the game, and after the last evaluated move
      - name: max_score_playing
        sql: max_score_playing
        type: number

      - name: min_score_playing
        sql: min_score_playing
        type: number

      - name: final_score_playing
        sql: final_score_playing
        type: number

      - name: nb_blunder_big_blunder_playing
        sql: nb_blunder_big_blunder_playing
        type: number

      - name: prct_time_remaining_playing_early
        sql: prct_time_remaining_playing_early
        type: number

      - name: prct_time_remaining_playing_mid
        sql: prct_time_remaining_playing_mid
        type: number

      - name: prct_time_remaining_playing_late
        sql: prct_time_remaining_playing_late
        type: number

      - name: has_throw_blunder_playing
        sql: has_throw_blunder_playing
        type: number

      - name: has_throw_blunder_playing_early
        sql: has_throw_blunder_playing_early
        type: number

      - name: has_throw_blunder_playing_mid
        sql: has_throw_blunder_playing_mid
        type: number

      - name: has_throw_blunder_playing_late
        sql: has_throw_blunder_playing_late
        type: number

      - name: has_throw_big_blunder_playing
        sql: has_throw_big_blunder_playing
        type: number

      - name: has_throw_big_blunder_playing_early
        sql: has_throw_big_blunder_playing_early
        type: number

      - name: has_throw_big_blunder_playing_mid
        sql: has_throw_big_blunder_playing_mid
        type: number

      - name: has_throw_big_blunder_playing_late
        sql: has_throw_big_blunder_playing_late
        type: number

      - name: has_miss_opp_blunder_playing
        sql: has_miss_opp_blunder_playing
        type: number

      - name: has_miss_opp_blunder_playing_early
        sql: has_miss_opp_blunder_playing_early
        type: number

      - name: has_miss_opp_blunder_playing_mid
        sql: has_miss_opp_blunder_playing_mid
        type: number

      - name: has_miss_opp_blunder_playing_late
        sql: has_miss_opp_blunder_playing_late
        type: number

      - name: has_miss_opp_big_blunder_playing
        sql: has_miss_opp_big_blunder_playing
        type: number

      - name: has_miss_opp_big_blunder_playing_early
        sql: has_miss_opp_big_blunder_playing_early
        type: number

      - name: has_miss_opp_big_blunder_playing_mid
        sql: has_miss_opp_big_blunder_playing_mid
        type: number

      - name: has_miss_opp_big_blunder_playing_late
        sql: has_miss_opp_big_blunder_playing_late
        type: number

      - name: first_blunder_big_blunder_playing_prct_time_remaining
        sql: first_blunder_big_blunder_playing_prct_time_remaining
        type: number

      - name: first_big_blunder_playing_prct_time_remaining
        sql: first_big_blunder_playing_prct_time_remaining
        type: number

      - name: first_miss_opp_big_blunder_playing_prct_time_remaining
        sql: first_miss_opp_big_blunder_playing_prct_time_remaining
        type: number

      - name: first_throw_big_blunder_playing_prct_time_remaining
        sql: first_throw_big_blunder_playing_prct_time_remaining
        type: number

      - name: score_playing_turn_5
        sql: score_playing_turn_5
        type: number

      - name: score_playing_turn_10
        sql: score_playing_turn_10
        type: number

      - name: score_playing_turn_15
        sql: score_playing_turn_15
        type: number

      - name: score_playing_turn_20
        sql: score_playing_turn_20
        type: number

      - name: score_playing_turn_25
        sql: score_playing_turn_25
        type: number

      - name: score_playing_turn_30
        sql: score_playing_turn_30
        type: number

      - name: score_playing_turn_35
        sql: score_playing_turn_35
        type: number

      - name: score_playing_turn_40
        sql: score_playing_turn_40
        type: number

      - name: score_playing_turn_45
        sql: score_playing_turn_45
        type: number

      - name: score_playing_turn_50
        sql: score_playing_turn_50
        type: number

    measures:
      # Clock (shares of the clock, 0-1), averaged over the games where the value exists
      - name: avg_first_big_blunder_prct_time_remaining
        sql: "{CUBE}.first_big_blunder_playing_prct_time_remaining"
        type: avg
        format: percent
      {%- for phase in ["early", "mid", "late"] %}

      - name: avg_prct_time_remaining_playing_{{ phase | safe }}
        sql: "{CUBE}.prct_time_remaining_playing_{{ phase | safe }}"
        type: avg
        format: percent
      {%- endfor %}

      # Share of games with at least one blunder of each kind (has_* flags are 0/1 per game), overall and per phase
      {%- for context in ["throw", "miss_opp"] %}
      {%- for severity in ["blunder", "big_blunder"] %}
      {%- for phase in ["", "_early", "_mid", "_late"] %}
      - name: prct_games_{{ context | safe }}_{{ severity | safe }}_playing{{ phase | safe }}
        sql: "{CUBE}.has_{{ context | safe }}_{{ severity | safe }}_playing{{ phase | safe }}"
        type: avg
        format: percent
      {%- endfor %}
      {%- endfor %}

      # Same, any severity (blunder or big blunder): a game counts once even if it has both
      {%- for phase in ["", "_early", "_mid", "_late"] %}
      - name: prct_games_{{ context | safe }}_any_blunder_playing{{ phase | safe }}
        sql: "{CUBE}.has_{{ context | safe }}_playing{{ phase | safe }}"
        type: avg
        format: percent
      {%- endfor %}
      {%- endfor %}
