# Sandbox: Tableau LoD / DAX equivalents on the 9-game toy dataset (schema chess)
cubes:
  - name: dim_player
    sql_table: chess.dim_player

    dimensions:
      - name: player_id
        sql: player_id
        type: number
        primary_key: true

      - name: username_global
        sql: username_global
        type: string

  - name: fact_games
    sql_table: chess.fact_games

    joins:
      - name: dim_player
        sql: "{CUBE}.player_id = {dim_player}.player_id"
        relationship: many_to_one

    dimensions:
      - name: game_id
        sql: game_id
        type: number
        primary_key: true

      - name: year
        sql: year
        type: number

      - name: time_class
        sql: time_class
        type: string

      - name: game_date
        sql: game_date
        type: time

      # Conditional measures · switch dimension (no sql, Tesseract only)
      - name: metric
        type: switch
        values:
          - games
          - wins
          - players

      # Free input (A) · filter on days_ago <= N
      - name: days_ago
        sql: "CURRENT_DATE - {CUBE}.game_date"
        type: number

      # Free input (B) · parameter dimension: renders the filtered value itself, so n_days = N is always true
      - name: n_days
        sql: "{FILTER_PARAMS.fact_games.n_days.filter(lambda x: x)}"
        type: number

    measures:
      - name: nb_wins
        sql: win
        type: sum

      - name: nb_games_played
        sql: total_games
        type: sum

      - name: nb_games_played_current_year
        sql: total_games
        type: sum
        filters:
          - sql: "{CUBE}.year = EXTRACT(YEAR FROM CURRENT_DATE)"

      - name: nb_players
        sql: "{dim_player.player_id}"
        type: count_distinct

      - name: win_rate
        type: number
        sql: "1.0 * {nb_wins} / NULLIF({nb_games_played}, 0)"
        format: percent

      # ID 1 · Simple win rate
      - name: id1_simple
        type: number
        sql: "{win_rate}"
        format: percent

      # ID 2 · Tableau INCLUDE
      - name: id2_include
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        grain:
          include:
            - dim_player.username_global

      # ID 3 · Tableau EXCLUDE player dim
      - name: id3_exclude_player
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        grain:
          exclude:
            - dim_player.username_global

      # ID 4 · Tableau EXCLUDE <all dims but player dim>
      - name: id4_exclude_all_but_player
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        grain:
          keep_only:
            - dim_player.username_global

      # ID 5.A · Intermediate Cube step (= win_rate_per_player_max_fixed_grain_unfiltered)
      - name: id5a_cube_intermediate
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        grain:
          keep_only: []
          include:
            - dim_player.username_global
        filter:
          keep_only: []

      # ID 5 · Tableau FIXED (= win_rate_per_player_max_tableau_fixed)
      - name: id5_fixed
        multi_stage: true
        sql: "{id5a_cube_intermediate}"
        type: max
        format: percent
        grain:
          include:
            - dim_player.username_global

      # ID 6 intermediate (= win_rate_per_player_max_fixed_grain_filtered)
      - name: id6_intermediate
        multi_stage: true
        sql: "{win_rate}"
        type: max
        format: percent
        grain:
          keep_only: []
          include:
            - dim_player.username_global

      # ID 6 · Tableau FIXED + context filters (= win_rate_per_player_max_tableau_fixed_context)
      - name: id6_fixed_context
        multi_stage: true
        sql: "{id6_intermediate}"
        type: max
        format: percent
        grain:
          include:
            - dim_player.username_global

      # Jinja: MIN / MAX / AVG of the per-player win rate
      {%- for agg in ["min", "max", "avg"] %}
      - name: win_rate_per_player_{{ agg | safe }}
        multi_stage: true
        sql: "{win_rate}"
        type: {{ agg | safe }}
        format: percent
        grain:
          include:
            - dim_player.username_global
      {%- endfor %}

      # Workaround: NULL instead of the grand total when username_global is not in the query (grain: keep_only)
      - name: is_grouped_by_player
        multi_stage: true
        sql: "{nb_players}"
        type: max
        grain:
          keep_only:
            - dim_player.username_global
        filter:
          keep_only: []

      - name: id4_exclude_all_but_player_strict
        multi_stage: true
        sql: "CASE WHEN {is_grouped_by_player} = 1 THEN {id4_exclude_all_but_player} END"
        type: number
        format: percent

      # Time intelligence · Rolling windows
      - name: nb_games_played_cumulative
        sql: total_games
        type: sum
        rolling_window:
          trailing: unbounded

      - name: nb_games_played_last_12_months
        sql: total_games
        type: sum
        rolling_window:
          trailing: 1 year

      - name: nb_wins_last_12_months
        sql: win
        type: sum
        rolling_window:
          trailing: 1 year

      - name: win_rate_last_12_months
        type: number
        sql: "1.0 * {nb_wins_last_12_months} / NULLIF({nb_games_played_last_12_months}, 0)"
        format: percent

      # Workaround: wrong ratio when one of its rolling inputs is also in the query (Tesseract, v1.7.45)
      - name: nb_wins_last_12_months_hidden
        sql: win
        type: sum
        public: false
        rolling_window:
          trailing: 1 year

      - name: nb_games_played_last_12_months_hidden
        sql: total_games
        type: sum
        public: false
        rolling_window:
          trailing: 1 year

      - name: win_rate_last_12_months_safe
        type: number
        sql: "1.0 * {nb_wins_last_12_months_hidden} / NULLIF({nb_games_played_last_12_months_hidden}, 0)"
        format: percent

      # Time intelligence · Period-to-date
      - name: nb_games_played_ytd
        sql: total_games
        type: sum
        rolling_window:
          type: to_date
          granularity: year

      - name: nb_wins_ytd
        sql: win
        type: sum
        rolling_window:
          type: to_date
          granularity: year

      - name: win_rate_ytd
        type: number
        sql: "1.0 * {nb_wins_ytd} / NULLIF({nb_games_played_ytd}, 0)"
        format: percent

      # Time intelligence · Time shift
      - name: nb_games_played_prior_year
        multi_stage: true
        sql: "{nb_games_played}"
        type: number
        time_shift:
          - interval: 1 year
            type: prior

      - name: win_rate_prior_year
        multi_stage: true
        sql: "{win_rate}"
        type: number
        format: percent
        time_shift:
          - interval: 1 year
            type: prior

      - name: nb_games_played_yoy_growth
        type: number
        sql: "1.0 * ({nb_games_played} - {nb_games_played_prior_year}) / NULLIF({nb_games_played_prior_year}, 0)"
        format: percent

      - name: nb_games_played_ytd_prior_year
        multi_stage: true
        sql: "{nb_games_played_ytd}"
        type: number
        time_shift:
          - time_dimension: game_date
            interval: 1 year
            type: prior

      # Conditional measures · case on the switch dimension (metric selector)
      - name: selected_metric
        multi_stage: true
        type: number
        case:
          switch: "{CUBE.metric}"
          when:
            - value: games
              sql: "{nb_games_played}"
            - value: wins
              sql: "{nb_wins}"
            - value: players
              sql: "{nb_players}"
          else:
            sql: "{nb_games_played}"

      # Free input (B) · win rate over the last N days, N passed with a filter on n_days
      - name: nb_wins_last_n_days
        sql: "CASE WHEN {FILTER_PARAMS.fact_games.n_days.filter(lambda x: f'CURRENT_DATE - game_date <= {x}')} THEN win END"
        type: sum

      - name: nb_games_played_last_n_days
        sql: "CASE WHEN {FILTER_PARAMS.fact_games.n_days.filter(lambda x: f'CURRENT_DATE - game_date <= {x}')} THEN total_games END"
        type: sum

      - name: win_rate_last_n_days
        type: number
        sql: "1.0 * {nb_wins_last_n_days} / NULLIF({nb_games_played_last_n_days}, 0)"
        format: percent

  # Last N games per player: the query filters are pushed into the subquery (FILTER_PARAMS),
  # so ROW_NUMBER() ranks the games that remain AFTER filtering
  - name: fact_games_last_n
    extends: fact_games
    public: false
    sql: |
      SELECT
          *,
          ROW_NUMBER() OVER (PARTITION BY player_id ORDER BY game_date DESC, game_id DESC) AS game_rank
      FROM chess.fact_games
      WHERE {FILTER_GROUP(
        FILTER_PARAMS.fact_games_last_n.time_class.filter('time_class'),
        FILTER_PARAMS.fact_games_last_n.year.filter('year'),
        FILTER_PARAMS.fact_games_last_n.game_date.filter('game_date')
      )}

    # Inherited from fact_games: joins, dimensions (game_id, year, time_class, ...) and measures (nb_wins, win_rate, ...)
    dimensions:
      # 1 = most recent game of the player, among the filtered games
      - name: game_rank
        sql: game_rank
        type: number

      # Input parameter: renders the filtered value itself, so n_games = N is always true
      - name: n_games
        sql: "{FILTER_PARAMS.fact_games_last_n.n_games.filter(lambda x: x)}"
        type: number

    measures:
      - name: nb_wins_last_n_games
        sql: "CASE WHEN {FILTER_PARAMS.fact_games_last_n.n_games.filter(lambda x: f'game_rank <= {x}')} THEN win END"
        type: sum

      - name: nb_games_played_last_n_games
        sql: "CASE WHEN {FILTER_PARAMS.fact_games_last_n.n_games.filter(lambda x: f'game_rank <= {x}')} THEN total_games END"
        type: sum

      - name: win_rate_last_n_games
        type: number
        sql: "1.0 * {nb_wins_last_n_games} / NULLIF({nb_games_played_last_n_games}, 0)"
        format: percent

views:
  - name: v_fact_games

    cubes:
      - join_path: fact_games
        includes:
          - year
          - time_class
          - nb_games_played
          - nb_games_played_current_year
          - nb_players
          - win_rate
          - id1_simple
          - id2_include
          - id3_exclude_player
          - id4_exclude_all_but_player
          - id5a_cube_intermediate
          - id5_fixed
          - id6_intermediate
          - id6_fixed_context
          - win_rate_per_player_min
          - win_rate_per_player_max
          - win_rate_per_player_avg
          - is_grouped_by_player
          - id4_exclude_all_but_player_strict
          - game_date
          - nb_games_played_cumulative
          - nb_games_played_last_12_months
          - nb_wins_last_12_months
          - win_rate_last_12_months
          - win_rate_last_12_months_safe
          - nb_games_played_ytd
          - nb_wins_ytd
          - win_rate_ytd
          - nb_games_played_prior_year
          - win_rate_prior_year
          - nb_games_played_yoy_growth
          - nb_games_played_ytd_prior_year
          - metric
          - selected_metric
          - days_ago
          - n_days
          - nb_wins_last_n_days
          - nb_games_played_last_n_days
          - win_rate_last_n_days

      - join_path: fact_games.dim_player
        includes:
          - username_global

  - name: v_fact_games_last_n

    cubes:
      - join_path: fact_games_last_n
        includes:
          - year
          - time_class
          - game_date
          - game_rank
          - n_games
          - nb_games_played
          - win_rate
          - nb_games_played_last_n_games
          - win_rate_last_n_games

      - join_path: fact_games_last_n.dim_player
        includes:
          - username_global



