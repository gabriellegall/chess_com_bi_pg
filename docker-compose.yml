services:
  analytical_db:
    image: postgres:16
    container_name: chess_postgres_container
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - analytical_data:/var/lib/postgresql/data 
    ports:
      - "5433:5432"

  metabase:
    image: metabase/metabase:latest
    container_name: chess_metabase_container
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - analytical_db

  streamlit:
    image: gabriellegall/chess-com-bi-pg-streamlit:latest
    container_name: chess_streamlit_container
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      - analytical_db
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: analytical_db
      DB_PORT: 5432

  cube:
    image: cubejs/cube:latest
    container_name: chess_cube_container
    restart: always
    ports:
      - "4000:4000"
      - "15432:15432"
    depends_on:
      - analytical_db
    volumes:
      - ./cube:/cube/conf
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: analytical_db
      CUBEJS_DB_PORT: 5432
      CUBEJS_DB_NAME: ${DB_NAME}
      CUBEJS_DB_USER: ${DB_USER}
      CUBEJS_DB_PASS: ${DB_PASSWORD}
      CUBEJS_API_SECRET: ${CUBE_API_SECRET}
      CUBEJS_DEV_MODE: ${CUBE_DEV_MODE:-true}
      CUBEJS_TESSERACT_SQL_PLANNER: "true"
      CUBEJS_PG_SQL_PORT: 15432
      CUBEJS_SQL_USER: ${CUBE_SQL_USER}
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD}

  dbt:
    image: gabriellegall/chess-com-bi-pg-dbt:latest
    container_name: chess_dbt_container
    depends_on:
      - analytical_db
    working_dir: /app
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: analytical_db
      DB_PORT: 5432
      HEALTHCHECK_URL: ${HEALTHCHECK_URL}
      HEALTHCHECK_URL_DBT_TEST: ${HEALTHCHECK_URL_DBT_TEST}

  watchtower:
    image: containrrr/watchtower:latest
    container_name: chess_watchtower_container
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCHEDULE=0 0 * * * * 
      - TZ=Europe/Paris
    command: chess_dbt_container chess_streamlit_container

volumes:
  analytical_data: